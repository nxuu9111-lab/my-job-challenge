<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Laurina's 100 Job Challenge</title>
    <style>
        :root { --primary: #e67e22; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 40px; }
        
        /* 核心修改1：页面变宽 */
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        
        h2 { color: var(--primary); margin-top: 0; }
        .top-right-stats { position: absolute; top: 30px; right: 30px; background: var(--primary); color: white; padding: 8px 18px; border-radius: 30px; font-weight: bold; font-size: 14px; }
        .progress-container { background: #eee; border-radius: 20px; height: 25px; margin: 20px 0; overflow: hidden; position: relative; }
        .progress-bar { background: linear-gradient(90deg, #3498db, #2ecc71); height: 100%; width: 0%; transition: width 0.5s ease; }
        .progress-text { position: absolute; width: 100%; text-align: center; line-height: 25px; font-weight: bold; color: #333; }
        .input-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        /* 核心修改2：表头不换行 */
        th { background: #f8f9fa; color: var(--primary); padding: 15px; text-align: left; border-bottom: 2px solid #eee; white-space: nowrap; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 14px; }

        .inline-select { padding: 5px 8px; border-radius: 5px; border: 1px solid #ddd; background: #fff; font-size: 13px; cursor: pointer; }
        .delete-btn { color: var(--danger); cursor: pointer; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-right-stats" id="topCounter">已投递: 0 / 100</div>
        <h2>🎯 Nuo's 全球职业冒险</h2>
        <p style="color: #7f8c8d; margin-top: -10px;">100个岗位/月投递追踪挑战</p>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">进度: 0 / 100</div>
        </div>
        
        <div class="input-group">
            <input type="text" id="companyInput" placeholder="公司名称">
            <input type="text" id="locationInput" placeholder="地点">
            <input type="text" id="roleInput" placeholder="岗位名称">
            <input type="text" id="detailsInput" placeholder="备注">
            <select id="statusSelect">
                <option value="已投递">已投递</option>
                <option value="沟通中">沟通中</option>
                <option value="面试阶段">面试阶段</option>
                <option value="已拿Offer">已拿Offer! 🎉</option>
                <option value="未收到通知">未收到通知</option>
                <option value="遗憾被拒">遗憾被拒</option>
            </select>
            <button onclick="addJob()">添加记录</button>
        </div>

        <table id="jobTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>日期</th>
                    <th>公司/地点</th>
                    <th>岗位名称</th>
                    <th>备注信息</th>
                    <th style="min-width: 140px;">当前状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // 密码锁
        const PASS_WORD = "123456"; 
        let accessGranted = false;
        while (!accessGranted) {
            const userInput = prompt("🔒 请输入访问密码：");
            if (userInput === PASS_WORD) {
                accessGranted = true;
            } else if (userInput === null) {
                window.location.href = "about:blank";
                break;
            } else {
                alert("密码错误！");
            }
        }

        let jobs = [];
        try {
            const saved = localStorage.getItem('myJobHunt');
            jobs = saved ? JSON.parse(saved) : [];
        } catch (e) {
            jobs = [];
        }

        function updateUI() {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            jobs.forEach((job, index) => {
                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${job.date}</td>
                    <td><strong>${job.company}</strong><br><small style="color:#7f8c8d">${job.location}</small></td>
                    <td>${job.role}</td>
                    <td>${job.details}</td>
                    <td>
                        <select class="inline-select" onchange="updateStatus(${index}, this.value)">
                            <option value="已投递" ${job.status === '已投递' ? 'selected' : ''}>已投递</option>
                            <option value="沟通中" ${job.status === '沟通中' ? 'selected' : ''}>沟通中</option>
                            <option value="面试阶段" ${job.status === '面试阶段' ? 'selected' : ''}>面试阶段</option>
                            <option value="已拿Offer" ${job.status === '已拿Offer' ? 'selected' : ''}>已拿Offer! 🎉</option>
                            <option value="未收到通知" ${job.status === '未收到通知' ? 'selected' : ''}>未收到通知</option>
                            <option value="遗憾被拒" ${job.status === '遗憾被拒' ? 'selected' : ''}>遗憾被拒</option>
                        </select>
                    </td>
                    <td><span class="delete-btn" onclick="deleteJob(${index})">删除</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });

            const count = jobs.length;
            const percentage = Math.min((count / 100) * 100, 100);
            if(document.getElementById('topCounter')) document.getElementById('topCounter').innerText = `已投递: ${count} / 100`;
            if(document.getElementById('progressBar')) document.getElementById('progressBar').style.width = percentage + '%';
            if(document.getElementById('progressText')) document.getElementById('progressText').innerText = `进度: ${count} / 100`;
            localStorage.setItem('myJobHunt', JSON.stringify(jobs));
        }

        function updateStatus(index, newStatus) {
            jobs[index].status = newStatus;
            updateUI();
        }

        function addJob() {
            const company = document.getElementById('companyInput').value.trim();
            const location = document.getElementById('locationInput').value.trim();
            const role = document.getElementById('roleInput').value.trim();
            const details = document.getElementById('detailsInput').value.trim();
            const status = document.getElementById('statusSelect').value;

            if(!company || !role) {
                alert("请输入公司名称和岗位！");
                return;
            }

            const newJob = {
                date: new Date().toLocaleDateString(),
                company, location, role, details, status
            };

            jobs.push(newJob);
            document.getElementById('companyInput').value = '';
            document.getElementById('locationInput').value = '';
            document.getElementById('roleInput').value = '';
            document.getElementById('detailsInput').value = '';
            updateUI();
        }

        function deleteJob(index) {
            if(confirm('确定删除这条记录吗？')) {
                jobs.splice(index, 1);
                updateUI();
            }
        }

        window.onload = updateUI;
    </script>
</body>
</html>
