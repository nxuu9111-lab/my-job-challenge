<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Laurina's 100 Job Challenge</title>
    <style>
        :root { --primary: #e67e22; --accent: #3498db; --success: #2ecc71; --danger: #e74c3c; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        
        .container { max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        
        h2 { color: var(--primary); margin-top: 0; }
        .top-right-stats { position: absolute; top: 30px; right: 30px; background: var(--primary); color: white; padding: 8px 18px; border-radius: 30px; font-weight: bold; font-size: 14px; }
        
        .progress-container { background: #eee; border-radius: 20px; height: 25px; margin: 20px 0; overflow: hidden; position: relative; }
        .progress-bar { background: linear-gradient(90deg, #3498db, #2ecc71); height: 100%; width: 0%; transition: width 0.5s ease; }
        .progress-text { position: absolute; width: 100%; text-align: center; line-height: 25px; font-weight: bold; color: #333; }
        
        .input-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; table-layout: fixed; }
        th { background: #f8f9fa; color: var(--primary); padding: 15px; text-align: left; border-bottom: 2px solid #eee; white-space: nowrap; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 13px; vertical-align: middle; word-wrap: break-word; }

        /* 状态背景色控制 */
        .status-cell select { 
            width: 100%; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center;
        }
        .st-applied { background: #dfe6e9 !important; color: #2d3436 !important; } /* 已投递-灰色 */
        .st-chatting { background: #ffeaa7 !important; color: #d35400 !important; } /* 沟通中-黄色 */
        .st-interview { background: #74b9ff !important; color: white !important; } /* 面试-蓝色 */
        .st-offer { background: #55efc4 !important; color: #00b894 !important; } /* Offer-绿色 */
        .st-rejected { background: #ff7675 !important; color: white !important; } /* 被拒-红色 */
